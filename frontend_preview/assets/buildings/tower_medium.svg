<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="26" ry="4" fill="rgba(0,0,0,0.35)"/>

  <!-- Tower Body (Cylindrical Stone) -->
  <rect x="18" y="24" width="28" height="37" fill="#1e293b"/>
  <rect x="20" y="24" width="24" height="35" fill="#334155"/>

  <!-- Tower Balcony / Battlements -->
  <rect x="15" y="20" width="34" height="5" fill="#1e293b"/>
  <rect x="14" y="16" width="5" height="5" fill="#475569"/>
  <rect x="23" y="16" width="5" height="5" fill="#475569"/>
  <rect x="36" y="16" width="5" height="5" fill="#475569"/>
  <rect x="45" y="16" width="5" height="5" fill="#475569"/>

  <!-- Conical Wizard Roof -->
  <polygon points="32,2 14,20 50,20" fill="#4338ca"/>
  <polygon points="32,2 20,20 44,20" fill="#6366f1"/>

  <!-- Spire Crystal Orb at apex -->
  <circle cx="32" cy="3" r="3" fill="#38bdf8"/>
  <circle cx="32" cy="3" r="6" fill="rgba(56,189,248,0.25)"/>

  <!-- Arched Wizard Window with glowing arcane light -->
  <path d="M 28 36 L 28 31 A 4 4 0 0 1 36 31 L 36 36 Z" fill="#c084fc"/>
  <path d="M 29 35 L 29 31 A 3 3 0 0 1 35 31 L 35 35 Z" fill="#f3e8ff"/>

  <!-- Glowing Arcane Runes Carved in Stone -->
  <rect x="22" y="44" width="2" height="4" fill="#38bdf8"/>
  <rect x="24" y="46" width="3" height="1" fill="#38bdf8"/>
  <rect x="39" y="42" width="3" height="1" fill="#c084fc"/>
  <rect x="40" y="44" width="1" height="3" fill="#c084fc"/>

  <!-- Tower Entrance Door -->
  <path d="M 28 61 L 28 50 A 4 4 0 0 1 36 50 L 36 61 Z" fill="#0f172a"/>
  <path d="M 29 60 L 29 51 A 3 3 0 0 1 35 51 L 35 60 Z" fill="#78350f"/>
  <rect x="33" y="55" width="2" height="2" fill="#facc15"/>
</svg>
