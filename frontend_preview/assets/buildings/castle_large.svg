<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <!-- Ground Shadow -->
  <ellipse cx="48" cy="90" rx="44" ry="5" fill="rgba(0,0,0,0.4)"/>

  <!-- Main Castle Stone Base -->
  <rect x="12" y="32" width="72" height="58" fill="#334155"/>
  <rect x="14" y="34" width="68" height="54" fill="#475569"/>

  <!-- Left Tower -->
  <rect x="8" y="16" width="22" height="74" fill="#334155"/>
  <rect x="10" y="18" width="18" height="70" fill="#64748b"/>
  <!-- Left Tower Battlements -->
  <rect x="6" y="10" width="6" height="8" fill="#475569"/>
  <rect x="16" y="10" width="6" height="8" fill="#475569"/>
  <rect x="26" y="10" width="6" height="8" fill="#475569"/>
  <rect x="6" y="16" width="26" height="3" fill="#334155"/>

  <!-- Right Tower -->
  <rect x="66" y="16" width="22" height="74" fill="#334155"/>
  <rect x="68" y="18" width="18" height="70" fill="#64748b"/>
  <!-- Right Tower Battlements -->
  <rect x="64" y="10" width="6" height="8" fill="#475569"/>
  <rect x="74" y="10" width="6" height="8" fill="#475569"/>
  <rect x="84" y="10" width="6" height="8" fill="#475569"/>
  <rect x="64" y="16" width="26" height="3" fill="#334155"/>

  <!-- Central Keep Wall Battlements -->
  <rect x="32" y="26" width="6" height="7" fill="#475569"/>
  <rect x="42" y="26" width="6" height="7" fill="#475569"/>
  <rect x="52" y="26" width="6" height="7" fill="#475569"/>
  <rect x="30" y="31" width="36" height="3" fill="#334155"/>

  <!-- Stone Brick Pattern Lines -->
  <line x1="14" y1="46" x2="82" y2="46" stroke="#334155" stroke-width="1"/>
  <line x1="14" y1="58" x2="82" y2="58" stroke="#334155" stroke-width="1"/>
  <line x1="14" y1="70" x2="82" y2="70" stroke="#334155" stroke-width="1"/>
  <!-- Vertical Brick Offsets -->
  <rect x="24" y="34" width="1" height="12" fill="#334155"/>
  <rect x="44" y="34" width="1" height="12" fill="#334155"/>
  <rect x="64" y="34" width="1" height="12" fill="#334155"/>
  <rect x="34" y="46" width="1" height="12" fill="#334155"/>
  <rect x="54" y="46" width="1" height="12" fill="#334155"/>
  <rect x="74" y="46" width="1" height="12" fill="#334155"/>

  <!-- Portcullis / Grand Entrance Doorway -->
  <path d="M 38 90 L 38 64 A 10 10 0 0 1 58 64 L 58 90 Z" fill="#0f172a"/>
  <!-- Iron Gate Grate -->
  <line x1="42" y1="62" x2="42" y2="90" stroke="#64748b" stroke-width="2"/>
  <line x1="48" y1="56" x2="48" y2="90" stroke="#64748b" stroke-width="2"/>
  <line x1="54" y1="62" x2="54" y2="90" stroke="#64748b" stroke-width="2"/>
  <line x1="38" y1="70" x2="58" y2="70" stroke="#64748b" stroke-width="2"/>
  <line x1="38" y1="80" x2="58" y2="80" stroke="#64748b" stroke-width="2"/>

  <!-- Grand Castle Crest Banner -->
  <rect x="44" y="36" width="8" height="14" fill="#d97706"/>
  <polygon points="44,50 48,54 52,50" fill="#d97706"/>
  <rect x="46" y="39" width="4" height="6" fill="#fef08a"/>

  <!-- Flagpoles on Towers -->
  <rect x="18" y="2" width="2" height="10" fill="#94a3b8"/>
  <polygon points="20,2 32,5 20,8" fill="#dc2626"/>
  <rect x="76" y="2" width="2" height="10" fill="#94a3b8"/>
  <polygon points="78,2 90,5 78,8" fill="#dc2626"/>

  <!-- Glowing Arrow Slit Windows -->
  <rect x="18" y="32" width="3" height="8" fill="#fef08a"/>
  <rect x="18" y="52" width="3" height="8" fill="#fef08a"/>
  <rect x="75" y="32" width="3" height="8" fill="#fef08a"/>
  <rect x="75" y="52" width="3" height="8" fill="#fef08a"/>
</svg>
