<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="32" cy="46" rx="28" ry="3" fill="rgba(0,0,0,0.3)"/>

  <!-- Chimney -->
  <rect x="44" y="6" width="7" height="18" fill="#475569"/>
  <rect x="45" y="7" width="5" height="16" fill="#64748b"/>
  <circle cx="47" cy="3" r="2.5" fill="rgba(203,213,225,0.4)"/>
  <circle cx="49" cy="-1" r="3.5" fill="rgba(203,213,225,0.2)"/>

  <!-- Main Timber House Walls -->
  <rect x="8" y="20" width="48" height="26" fill="#78350f"/>
  <rect x="10" y="22" width="44" height="23" fill="#b45309"/>

  <!-- Timber Framing Beams (Half-Timbered Tudor Style) -->
  <rect x="8" y="20" width="4" height="26" fill="#451a03"/>
  <rect x="52" y="20" width="4" height="26" fill="#451a03"/>
  <rect x="30" y="20" width="4" height="26" fill="#451a03"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#451a03" stroke-width="2"/>

  <!-- Thatched Straw Roof -->
  <polygon points="32,2 4,22 60,22" fill="#d97706"/>
  <polygon points="32,4 8,20 56,20" fill="#fbbf24"/>
  <!-- Thatch Overhang / Ridge -->
  <rect x="2" y="20" width="60" height="3" fill="#b45309"/>
  <rect x="3" y="21" width="58" height="1" fill="#fef08a"/>

  <!-- Rounded Oak Door -->
  <path d="M 14 46 L 14 30 A 4 4 0 0 1 24 30 L 24 46 Z" fill="#451a03"/>
  <path d="M 15 45 L 15 31 A 3 3 0 0 1 23 31 L 23 45 Z" fill="#92400e"/>
  <!-- Brass Doorknob -->
  <circle cx="21" cy="38" r="1" fill="#facc15"/>

  <!-- Warm Glowing Window Pane -->
  <rect x="36" y="26" width="12" height="12" fill="#451a03"/>
  <rect x="37" y="27" width="10" height="10" fill="#fef08a"/>
  <!-- Window Crossbar -->
  <line x1="42" y1="27" x2="42" y2="37" stroke="#451a03" stroke-width="1"/>
  <line x1="37" y1="32" x2="47" y2="32" stroke="#451a03" stroke-width="1"/>

  <!-- Flower Box under Window -->
  <rect x="36" y="38" width="12" height="3" fill="#78350f"/>
  <circle cx="38" cy="37" r="1.5" fill="#f43f5e"/>
  <circle cx="42" cy="37" r="1.5" fill="#ec4899"/>
  <circle cx="46" cy="37" r="1.5" fill="#a855f7"/>
</svg>
