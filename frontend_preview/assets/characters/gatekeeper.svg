<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Magical Aura Aura -->
  <circle cx="16" cy="18" r="13" fill="rgba(56, 189, 248, 0.12)"/>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="9" ry="2.5" fill="rgba(0,0,0,0.4)"/>
  <!-- Robe Skirt -->
  <rect x="9" y="16" width="14" height="13" fill="#1e1b4b"/>
  <rect x="10" y="17" width="12" height="11" fill="#312e81"/>
  <!-- Robe Trim (Gold) -->
  <rect x="8" y="28" width="16" height="1" fill="#d4af37"/>
  <rect x="15" y="17" width="2" height="12" fill="#d4af37"/>
  <!-- Torso & Belt -->
  <rect x="10" y="12" width="12" height="6" fill="#3730a3"/>
  <rect x="10" y="16" width="12" height="2" fill="#854d0e"/>
  <rect x="15" y="16" width="2" height="2" fill="#facc15"/>
  <!-- Sleeves & Arms -->
  <rect x="8" y="13" width="3" height="7" fill="#312e81"/>
  <rect x="21" y="13" width="3" height="7" fill="#312e81"/>
  <!-- Hands -->
  <rect x="8" y="19" width="2" height="2" fill="#fcd34d"/>
  <rect x="22" y="16" width="2" height="2" fill="#fcd34d"/>
  <!-- Wooden Staff -->
  <rect x="23" y="6" width="2" height="24" fill="#78350f"/>
  <rect x="22" y="5" width="4" height="2" fill="#92400e"/>
  <!-- Glowing Azure Crystal at top of staff -->
  <rect x="22" y="2" width="4" height="4" fill="#38bdf8"/>
  <rect x="23" y="1" width="2" height="6" fill="#bae6fd"/>
  <circle cx="24" cy="4" r="5" fill="rgba(56, 189, 248, 0.3)"/>
  <!-- Face & Beard -->
  <rect x="13" y="8" width="6" height="5" fill="#fed7aa"/>
  <!-- Eyes -->
  <rect x="14" y="9" width="1" height="1" fill="#0f172a"/>
  <rect x="17" y="9" width="1" height="1" fill="#0f172a"/>
  <!-- Majestic Grey Beard -->
  <rect x="12" y="11" width="8" height="6" fill="#e2e8f0"/>
  <rect x="13" y="17" width="6" height="3" fill="#cbd5e1"/>
  <rect x="14" y="20" width="4" height="2" fill="#94a3b8"/>
  <!-- Wizard Hat Brim -->
  <rect x="8" y="7" width="16" height="2" fill="#1e1b4b"/>
  <rect x="9" y="8" width="14" height="1" fill="#4338ca"/>
  <!-- Wizard Hat Cone -->
  <rect x="11" y="4" width="10" height="3" fill="#312e81"/>
  <rect x="12" y="2" width="8" height="2" fill="#3730a3"/>
  <rect x="14" y="0" width="5" height="2" fill="#4338ca"/>
  <rect x="17" y="1" width="3" height="2" fill="#4f46e5"/>
  <!-- Golden Hat Band & Rune Star -->
  <rect x="11" y="6" width="10" height="1" fill="#d4af37"/>
  <rect x="15" y="5" width="2" height="2" fill="#38bdf8"/>
</svg>
