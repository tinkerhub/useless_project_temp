<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#1c1917"/>
  <!-- Cracked obsidian plates -->
  <rect x="2" y="2" width="13" height="13" fill="#292524"/>
  <rect x="17" y="2" width="13" height="13" fill="#292524"/>
  <rect x="2" y="17" width="13" height="13" fill="#292524"/>
  <rect x="17" y="17" width="13" height="13" fill="#292524"/>
  <!-- Magma fissures in cracks -->
  <line x1="0" y1="16" x2="32" y2="16" stroke="#ea580c" stroke-width="2"/>
  <line x1="16" y1="0" x2="16" y2="32" stroke="#ea580c" stroke-width="2"/>
  <!-- Bright molten glow center -->
  <circle cx="16" cy="16" r="3" fill="#facc15"/>
</svg>
