<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="28" fill="#070a0f" stroke="#38bdf8" stroke-width="2"/>
  <!-- Earth sphere -->
  <circle cx="32" cy="32" r="16" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
