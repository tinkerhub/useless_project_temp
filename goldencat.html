<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Cat Translator 🐱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff8fb1;
    --pink-dark:#ff5f96;
    --purple:#a78bfa;
    --peach:#ffd7a8;
    --cream:#fff8f0;
    --ink:#3d2b3d;
    --bubble-user:#eef1ff;
    --bubble-cat:#fff0f6;
    --shadow: 0 10px 30px rgba(160, 80, 130, 0.18);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #ffe3ef 0%, transparent 45%),
      radial-gradient(circle at 85% 0%, #e3e0ff 0%, transparent 40%),
      linear-gradient(160deg, #fff8f0 0%, #ffeef5 60%, #f1ecff 100%);
    color:var(--ink);
    padding: 18px;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  header{
    text-align:center;
    margin-bottom:14px;
  }
  h1{
    font-family:'Baloo 2', cursive;
    font-size: clamp(28px, 7vw, 42px);
    margin:6px 0 2px;
    background: linear-gradient(90deg, var(--pink-dark), var(--purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    font-size:14px;
    opacity:0.75;
    font-weight:600;
  }

  /* ---------- Animated Cat ---------- */
  .cat-stage{
    display:flex;
    justify-content:center;
    margin:14px 0 6px;
  }
  .cat{
    position:relative;
    width:130px;
    height:120px;
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-8px) rotate(-2deg); }
  }
  .cat .ear{
    position:absolute; top:-18px; width:0; height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-bottom:38px solid var(--peach);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.08));
  }
  .cat .ear.left{ left:6px; transform: rotate(-18deg); }
  .cat .ear.right{ right:6px; transform: rotate(18deg); }
  .cat .ear::after{
    content:"";
    position:absolute; top:10px; left:-11px;
    width:0;height:0;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-bottom:20px solid #ffb6c9;
  }
  .cat .face{
    position:absolute; top:10px; left:5px;
    width:120px; height:100px;
    background: radial-gradient(circle at 30% 25%, #fff, var(--peach) 75%);
    border-radius: 60% 60% 55% 55% / 65% 65% 55% 55%;
    box-shadow: var(--shadow);
  }
  .cat .eye{
    position:absolute; top:44px; width:12px; height:16px;
    background:var(--ink); border-radius:50%;
    animation: blink 4.5s infinite;
  }
  .cat .eye.left{ left:30px; }
  .cat .eye.right{ right:30px; }
  @keyframes blink{
    0%,92%,100%{ transform: scaleY(1); }
    95%{ transform: scaleY(0.1); }
  }
  .cat .nose{
    position:absolute; top:62px; left:50%; transform:translateX(-50%);
    width:10px; height:8px; background:#ff8fb1; border-radius:50%;
  }
  .cat .whisker{
    position:absolute; top:64px; width:34px; height:2px; background:#caa; opacity:0.6; border-radius:2px;
  }
  .cat .whisker.l1{ left:-22px; top:58px; transform:rotate(-6deg);}
  .cat .whisker.l2{ left:-22px; top:66px; }
  .cat .whisker.r1{ right:-22px; top:58px; transform:rotate(6deg);}
  .cat .whisker.r2{ right:-22px; top:66px; }
  .cat .tail{
    position:absolute; bottom:-6px; right:-24px;
    width:14px; height:50px;
    background: var(--peach);
    border-radius: 20px;
    transform-origin: top center;
    animation: wag 1.4s ease-in-out infinite;
  }
  @keyframes wag{
    0%,100%{ transform: rotate(15deg); }
    50%{ transform: rotate(45deg); }
  }
  .mood-badge{
    text-align:center;
    font-weight:700;
    font-size:14px;
    margin-bottom:14px;
  }
  .mood-badge span{
    background:#fff;
    padding:6px 14px;
    border-radius:20px;
    box-shadow: var(--shadow);
    display:inline-block;
  }

  /* ---------- Card ---------- */
  .card{
    background:#fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:18px;
    margin-bottom:16px;
  }
  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .field{
    flex:1;
    min-width:140px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  label{
    font-size:12px;
    font-weight:700;
    opacity:0.65;
    padding-left:4px;
  }
  select, textarea{
    font-family:'Quicksand', sans-serif;
    border:2px solid #ffe1ec;
    background:#fffaf9;
    border-radius:14px;
    padding:10px 12px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    outline:none;
    transition: border 0.2s;
  }
  select:focus, textarea:focus{ border-color: var(--pink); }
  textarea{
    width:100%;
    min-height:80px;
    resize:vertical;
    font-weight:500;
  }
  .input-area{
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .mic-btn{
    flex-shrink:0;
    width:58px; height:58px;
    border-radius:50%;
    border:none;
    background: linear-gradient(145deg, var(--pink), var(--pink-dark));
    color:#fff;
    font-size:24px;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(255, 95, 150, 0.45);
    transition: transform 0.15s;
    display:flex; align-items:center; justify-content:center;
  }
  .mic-btn:active{ transform: scale(0.92); }
  .mic-btn.listening{
    animation: pulse 1s infinite;
    background: linear-gradient(145deg, #ff5f5f, #d43a3a);
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,95,95,0.6); }
    70%{ box-shadow: 0 0 0 16px rgba(255,95,95,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,95,95,0); }
  }
  .mic-note{
    font-size:12px;
    text-align:center;
    opacity:0.6;
    margin-top:6px;
  }
  .btn{
    border:none;
    cursor:pointer;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    border-radius:14px;
    padding:12px 16px;
    font-size:15px;
    transition: transform 0.15s, filter 0.15s;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{
    width:100%;
    background: linear-gradient(90deg, var(--pink-dark), var(--purple));
    color:#fff;
    box-shadow: 0 8px 18px rgba(167,139,250,0.35);
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-secondary{
    background:#f3eefc;
    color:var(--ink);
  }
  .btn-secondary:hover{ background:#eae2fb; }
  .btn-ghost{
    background:transparent;
    border:2px solid #ffd6e6;
    color:var(--ink);
  }
  .controls-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .controls-row .btn{ flex:1; min-width:110px; }

  /* ---------- Chat ---------- */
  .chat{
    display:flex;
    flex-direction:column;
    gap:12px;
    max-height:420px;
    overflow-y:auto;
    padding-right:4px;
  }
  .bubble{
    max-width:82%;
    padding:12px 16px;
    border-radius:18px;
    font-weight:600;
    line-height:1.4;
    animation: pop 0.25s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  @keyframes pop{
    from{ transform: scale(0.85); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }
  .bubble.user{
    align-self:flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius:4px;
  }
  .bubble.cat{
    align-self:flex-start;
    background: var(--bubble-cat);
    border-bottom-left-radius:4px;
  }
  .bubble .tag{
    display:block;
    font-size:11px;
    opacity:0.55;
    margin-bottom:3px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .bubble .reaction{
    font-size:18px;
    margin-left:6px;
  }
  .empty-state{
    text-align:center;
    opacity:0.5;
    font-size:14px;
    padding:20px 10px;
  }
  footer{
    text-align:center;
    font-size:12px;
    opacity:0.5;
    margin: 10px 0 20px;
  }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#ffd6e6; border-radius:10px; }

  @media (max-width:420px){
    .card{ padding:14px; }
    .controls-row .btn{ font-size:13px; padding:10px 10px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Funny Cat Translator 🐱</h1>
    <div class="subtitle">Speak human. Get meow. 100% scientifically unproven.</div>
  </header>

  <div class="cat-stage">
    <div class="cat" id="catFace">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="tail"></div>
      <div class="face">
        <div class="whisker l1"></div>
        <div class="whisker l2"></div>
        <div class="whisker r1"></div>
        <div class="whisker r2"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
      </div>
    </div>
  </div>

  <div class="mood-badge">Cat Mood: <span id="moodText">😺 Cute &amp; Curious</span></div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="langSelect">Speech Language</label>
        <select id="langSelect">
          <option value="en-US">English</option>
          <option value="ml-IN">മലയാളം (Malayalam)</option>
          <option value="hi-IN">हिन्दी (Hindi)</option>
        </select>
      </div>
      <div class="field">
        <label for="personalitySelect">Cat Personality</label>
        <select id="personalitySelect">
          <option value="cute">😻 Cute</option>
          <option value="angry">😾 Angry</option>
          <option value="lazy">😴 Lazy</option>
          <option value="sassy">😼 Sassy</option>
          <option value="dramatic">🎭 Dramatic</option>
          <option value="chaotic">🤪 Chaotic</option>
        </select>
      </div>
    </div>

    <div class="field" style="margin-bottom:6px;">
      <label for="textInput">Type or speak something human</label>
      <div class="input-area">
        <textarea id="textInput" placeholder="e.g. I am hungry, where is my food?"></textarea>
        <button class="mic-btn" id="micBtn" title="Tap to speak">🎤</button>
      </div>
    </div>
    <div class="mic-note" id="micNote"></div>

    <button class="btn btn-primary" id="translateBtn" style="margin-top:10px;">Translate to Cat 🐾</button>

    <div class="controls-row">
      <button class="btn btn-secondary" id="playBtn">▶ Play</button>
      <button class="btn btn-secondary" id="pauseBtn">⏸ Pause</button>
      <button class="btn btn-secondary" id="stopBtn">⏹ Stop</button>
      <button class="btn btn-secondary" id="replayBtn">🔁 Replay</button>
    </div>
    <div class="controls-row">
      <button class="btn btn-ghost" id="surpriseBtn">✨ Surprise Me</button>
      <button class="btn btn-ghost" id="copyBtn">📋 Copy Cat Text</button>
      <button class="btn btn-ghost" id="clearBtn">🗑 Clear History</button>
    </div>
  </div>

  <div class="card">
    <div class="chat" id="chat">
      <div class="empty-state" id="emptyState">No meows yet. Say something above! 🐟</div>
    </div>
  </div>

  <footer>Made with 🐾 for pure entertainment — no cats were harmed, only confused.</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------------- Elements ----------------
  const langSelect = document.getElementById('langSelect');
  const personalitySelect = document.getElementById('personalitySelect');
  const textInput = document.getElementById('textInput');
  const micBtn = document.getElementById('micBtn');
  const micNote = document.getElementById('micNote');
  const translateBtn = document.getElementById('translateBtn');
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('emptyState');
  const moodText = document.getElementById('moodText');
  const catFace = document.getElementById('catFace');

  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const replayBtn = document.getElementById('replayBtn');
  const surpriseBtn = document.getElementById('surpriseBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');

  let lastCatText = "";
  let lastUtterance = null;

  // ---------------- Cat language data ----------------
  const SYLLABLES = {
    cute:    ["mew","nyaa","purr","mrow","meep","nya~","mrrp","mewmew"],
    angry:   ["MRAW","HISS","GRR-MEOW","MRRROW","FFT-NYA","SPIT-MEW","YOWL"],
    lazy:    ["mrrph...","meeeow...","zzz-mew","nyaaa~","prrr...","mrow (yawn)"],
    sassy:   ["mew.","pfft-nya","meow~","*flick tail* mrow","nyeh","mrrp, obviously"],
    dramatic:["MEOOOOW!!","nyaAAAA!","*gasp* mrow!","prrROWL!","MEW OF DESTINY","nyaa... the horror... nyaa"],
    chaotic: ["MEOWmeowMEOW","nyanyanya!!","mrp-mrp-BOOP","*knocks cup off table* mrow","zoOOMies-nya","bleh-meow-poof"]
  };

  const CONNECTORS = ["~", ",", "!", "...", " -", " x", " &"];

  const REACTIONS = ["😺","😾","😹","😼","🐾","😻","🙀","😽"];

  const MOODS = {
    cute:    "😻 Cute & Curious",
    angry:   "😾 Angry & Hissy",
    lazy:    "😴 Lazy & Sleepy",
    sassy:   "😼 Sassy & Judging You",
    dramatic:"🎭 Dramatic & Extra",
    chaotic: "🤪 Chaotic & Unhinged"
  };

  const VOICE_SETTINGS = {
    cute:    { rate: 1.15, pitch: 1.7 },
    angry:   { rate: 1.3,  pitch: 0.6 },
    lazy:    { rate: 0.65, pitch: 0.9 },
    sassy:   { rate: 1.05, pitch: 1.3 },
    dramatic:{ rate: 0.85, pitch: 1.5 },
    chaotic: { rate: 1.6,  pitch: 1.4 }
  };

  const SURPRISE_PHRASES = [
    "meow meow, tuna diplomacy nyaa~",
    "prrr... the sunbeam has moved. MRAW.",
    "nyaa nyaa, I knocked it off the table on purpose, mew.",
    "MEOOOOW! The red dot betrayed me again.",
    "mrrp mrrp, 3am zoomies commencing... nya!",
    "hiss-purr-hiss, emotionally complex today",
    "mew mew mew, I require chin scritches immediately",
    "*stares into void* ...meow.",
    "nyaaaa, box is now mine. all mine. mrow."
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function updateMood(personality){
    moodText.textContent = MOODS[personality] || MOODS.cute;
  }

  function pulseCat(){
    catFace.style.animation = 'none';
    void catFace.offsetWidth;
    catFace.style.animation = 'bob 0.5s ease-in-out 2';
  }

  // ---------------- Translation logic ----------------
  function translateToCat(humanText, personality){
    const words = humanText.trim().split(/\s+/).filter(Boolean);
    const wordCount = Math.max(1, words.length);
    // number of cat "syllable groups" roughly proportional to input, capped
    const groups = Math.min(10, Math.max(2, Math.round(wordCount * 0.6)));

    const bank = SYLLABLES[personality] || SYLLABLES.cute;
    let parts = [];
    for(let i=0; i<groups; i++){
      let syl = pick(bank);
      // occasionally attach a connector for rhythm/variety
      if(Math.random() < 0.5 && i < groups - 1){
        syl += pick(CONNECTORS);
      }
      parts.push(syl);
    }
    let phrase = parts.join(" ");

    // personality-flavored wrap
    if(personality === "dramatic"){
      phrase = phrase + " !!";
    } else if(personality === "chaotic"){
      phrase = phrase.replace(/\s+/g, Math.random() < 0.5 ? " " : "-");
    } else if(personality === "lazy"){
      phrase = phrase + " ...zzz";
    }
    return phrase;
  }

  // ---------------- Rendering ----------------
  function addBubble(type, tag, text, reaction){
    emptyState.style.display = "none";
    const div = document.createElement('div');
    div.className = "bubble " + type;
    const tagEl = document.createElement('span');
    tagEl.className = "tag";
    tagEl.textContent = tag;
    div.appendChild(tagEl);
    const textEl = document.createElement('span');
    textEl.textContent = text;
    div.appendChild(textEl);
    if(reaction){
      const r = document.createElement('span');
      r.className = "reaction";
      r.textContent = reaction;
      div.appendChild(r);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function doTranslate(sourceTextOverride){
    const humanText = (sourceTextOverride !== undefined ? sourceTextOverride : textInput.value).trim();
    if(!humanText){
      textInput.focus();
      textInput.placeholder = "Type something first, human! 🐾";
      return;
    }
    const personality = personalitySelect.value;
    updateMood(personality);

    const catText = translateToCat(humanText, personality);
    const reaction = pick(REACTIONS);

    addBubble("user", "You said", humanText);
    addBubble("cat", "Cat says", catText, reaction);

    lastCatText = catText;
    pulseCat();
    speakCat(catText, personality);
  }

  // ---------------- Speech Recognition ----------------
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if(SpeechRecognitionAPI){
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){
      isListening = true;
      micBtn.classList.add('listening');
      micNote.textContent = "Listening... speak now 🎙";
    };

    recognition.onresult = function(event){
      let finalTranscript = "";
      let interimTranscript = "";
      for(let i = event.resultIndex; i < event.results.length; i++){
        const transcript = event.results[i][0].transcript;
        if(event.results[i].isFinal){
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }
      textInput.value = (finalTranscript || interimTranscript);
    };

    recognition.onerror = function(event){
      micNote.textContent = "Mic error: " + event.error + ". Try typing instead.";
      isListening = false;
      micBtn.classList.remove('listening');
    };

    recognition.onend = function(){
      isListening = false;
      micBtn.classList.remove('listening');
      if(textInput.value.trim()){
        micNote.textContent = "Got it! Tap Translate to Cat 🐾";
      } else {
        micNote.textContent = "";
      }
    };

    micBtn.addEventListener('click', function(){
      if(isListening){
        recognition.stop();
        return;
      }
      recognition.lang = langSelect.value;
      try{
        recognition.start();
      }catch(e){
        micNote.textContent = "Couldn't start mic: " + e.message;
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = "0.5";
    micBtn.style.cursor = "not-allowed";
    micNote.textContent = "🎤 Voice input isn't supported in this browser. Try Chrome on desktop/Android, or just type!";
  }

  // ---------------- Speech Synthesis ----------------
  const synth = window.speechSynthesis || null;

  function speakCat(catText, personality){
    if(!synth) return;
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(catText);
    const settings = VOICE_SETTINGS[personality] || VOICE_SETTINGS.cute;
    utter.rate = settings.rate;
    utter.pitch = settings.pitch;
    utter.volume = 1;
    lastUtterance = utter;
    synth.speak(utter);
  }

  playBtn.addEventListener('click', function(){
    if(!synth) return;
    if(synth.paused){
      synth.resume();
    } else if(lastCatText){
      speakCat(lastCatText, personalitySelect.value);
    }
  });

  pauseBtn.addEventListener('click', function(){
    if(synth && synth.speaking){ synth.pause(); }
  });

  stopBtn.addEventListener('click', function(){
    if(synth){ synth.cancel(); }
  });

  replayBtn.addEventListener('click', function(){
    if(lastCatText){
      speakCat(lastCatText, personalitySelect.value);
      pulseCat();
    }
  });

  if(!synth){
    [playBtn, pauseBtn, stopBtn, replayBtn].forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
  }

  // ---------------- Extra features ----------------
  surpriseBtn.addEventListener('click', function(){
    const personality = personalitySelect.value;
    updateMood(personality);
    const phrase = pick(SURPRISE_PHRASES);
    const reaction = pick(REACTIONS);
    addBubble("cat", "Random cat wisdom", phrase, reaction);
    lastCatText = phrase;
    pulseCat();
    speakCat(phrase, personality);
  });

  copyBtn.addEventListener('click', async function(){
    if(!lastCatText){
      copyBtn.textContent = "Nothing to copy yet 🐾";
      setTimeout(() => copyBtn.textContent = "📋 Copy Cat Text", 1500);
      return;
    }
    try{
      await navigator.clipboard.writeText(lastCatText);
      copyBtn.textContent = "Copied! ✅";
    }catch(e){
      copyBtn.textContent = "Copy failed 😿";
    }
    setTimeout(() => copyBtn.textContent = "📋 Copy Cat Text", 1500);
  });

  clearBtn.addEventListener('click', function(){
    chat.innerHTML = "";
    chat.appendChild(emptyState);
    emptyState.style.display = "block";
    lastCatText = "";
    if(synth) synth.cancel();
  });

  translateBtn.addEventListener('click', function(){ doTranslate(); });

  textInput.addEventListener('keydown', function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      doTranslate();
    }
  });

  personalitySelect.addEventListener('change', function(){
    updateMood(personalitySelect.value);
  });

  // init
  updateMood(personalitySelect.value);
})();
</script>
</body>
</html>
